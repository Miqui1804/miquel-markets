# Compila la app nativa (carpeta app/) de Android e iOS.
# Solo se ejecuta cuando cambia algo de app/: las actualizaciones diarias de datos de la web
# no necesitan compilar nada, porque la app carga siempre la web publicada.
name: App móvil

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-movil.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-movil.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-movil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: APK de prueba (instalable directamente en el móvil)
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: miquel-markets-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Solo si se han configurado los secrets de firma (ver app/README.md)
      - name: Preparar firma de Google Play
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: AAB firmado para Google Play
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Guardar AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: miquel-markets-android-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (comprobación de compilación)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Usar el Xcode más reciente del runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync ios

      # Compila para el simulador sin firmar: confirma que el proyecto está bien.
      # Para publicar en el App Store hay que firmar con tu cuenta de Apple Developer (ver app/README.md).
      - name: Compilar para el simulador
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
