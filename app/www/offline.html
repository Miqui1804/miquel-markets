<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Sin conexión · Miquel Markets</title>
<style>
:root{--bg:#070b14;--panel:#0f1828;--line:rgba(255,255,255,.09);--txt:#e8eef7;--muted:#8fa0b8;--gold:#f5c451}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(90,169,255,.10),transparent 60%),radial-gradient(800px 400px at 0% 10%,rgba(245,196,81,.08),transparent 55%),var(--bg);
color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
display:flex;align-items:center;justify-content:center;
padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.card{width:100%;max-width:380px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 24px}
.ico{width:64px;height:64px;margin:0 auto 18px;border-radius:16px;background:rgba(245,196,81,.12);display:flex;align-items:center;justify-content:center}
h1{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
p{color:var(--muted);font-size:.95rem}
button{margin-top:22px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--gold);color:#1a1404;font:inherit;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--txt);outline-offset:3px}
small{display:block;margin-top:14px;color:var(--muted);font-size:.8rem;min-height:1.2em}
</style>
</head>
<body>
<main class="card">
<div class="ico" aria-hidden="true">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f5c451" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16.1a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/></svg>
</div>
<h1>Sin conexión</h1>
<p>Miquel Markets necesita internet para mostrar los datos más recientes de los sistemas y del mercado.</p>
<button id="retry" type="button">Reintentar</button>
<small id="msg" role="status" aria-live="polite"></small>
</main>
<script>
var URL_APP='https://miqui1804.github.io/miquel-markets/';
var btn=document.getElementById('retry'),msg=document.getElementById('msg');
var SIGUE='Sigue sin haber conexión. Inténtalo de nuevo en un momento.',CLAVE='mmReintento';
/* Si el reintento falla, la app vuelve a cargar esta página desde cero: se avisa de que sigue sin conexión */
try{if(Date.now()-(+sessionStorage.getItem(CLAVE)||0)<15000)msg.textContent=SIGUE;sessionStorage.removeItem(CLAVE);}catch(e){}
function go(){try{sessionStorage.setItem(CLAVE,Date.now());}catch(e){}msg.textContent='Conectando…';btn.disabled=true;location.replace(URL_APP);setTimeout(function(){btn.disabled=false;msg.textContent=SIGUE;},8000);}
btn.addEventListener('click',go);
window.addEventListener('online',go);
</script>
</body>
</html>
